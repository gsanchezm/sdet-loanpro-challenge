# .github/workflows/ci.yml
name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    runs-on: ubuntu-latest
    env:
      SDET_RENDER_BASE_URL: ${{ vars.RENDER_BASE_URL }}
      SDET_AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
      TEST_ENVIRONMENTS: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Wait for Render service to be reachable
        run: |
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$SDET_RENDER_BASE_URL/dev/users")
            if [ "$status" = "200" ]; then
              echo "Service is up (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status $status, retrying in 10s..."
            sleep 10
          done
          echo "Service never became reachable" >&2
          exit 1

      - name: Run ${{ matrix.environment }} test suite
        run: |
          mkdir -p reports
          pytest tests/ \
            --junitxml=reports/${{ matrix.environment }}-junit.xml \
            --html=reports/${{ matrix.environment }}-report.html --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.environment }}
          path: reports/
