# .github/workflows/ci.yml
name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    runs-on: ubuntu-latest
    env:
      SDET_RENDER_BASE_URL: ${{ vars.RENDER_BASE_URL }}
      SDET_AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
      TEST_ENVIRONMENTS: ${{ matrix.environment }}
      TESTRAIL_BASE_URL: ${{ vars.TESTRAIL_BASE_URL }}
      TESTRAIL_USERNAME: ${{ vars.TESTRAIL_USERNAME }}
      TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
      TESTRAIL_PROJECT_ID: ${{ vars.TESTRAIL_PROJECT_ID }}
    steps:
      - name: "1. Checkout"
        uses: actions/checkout@v4

      - name: "2. Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "3. Install dependencies"
        run: pip install -e ".[dev]"

      - name: "4. Wait for Render service"
        run: |
          echo "::group::Waiting for $SDET_RENDER_BASE_URL"
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$SDET_RENDER_BASE_URL/dev/users")
            if [ "$status" = "200" ]; then
              echo "Service is up (attempt $i)"
              echo "::endgroup::"
              exit 0
            fi
            echo "Attempt $i: status $status, retrying in 10s..."
            sleep 10
          done
          echo "Service never became reachable" >&2
          echo "::endgroup::"
          exit 1

      - name: "5. Run ${{ matrix.environment }} test suite"
        run: |
          mkdir -p reports
          pytest tests/ \
            --junitxml=reports/${{ matrix.environment }}-junit.xml \
            --html=reports/${{ matrix.environment }}-report.html --self-contained-html

      - name: "6. Publish test reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.environment }}
          path: reports/

      - name: "7. Report results to TestRail"
        if: always() && env.TESTRAIL_API_KEY != ''
        run: python -m src.reporting.testrail_reporter reports/${{ matrix.environment }}-junit.xml ${{ matrix.environment }}
