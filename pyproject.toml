[project]
name = "sdet-loanpro-challenge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-html>=4.1",
    "Faker>=22.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
